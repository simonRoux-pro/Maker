# Deploiement Cloudflare Workers. Aucun secret ici.
#
# name doit etre identique au nom de l'application Cloudflare qui lance le
# build, sinon le deploiement est rejete pour cause de nom different.
# L'application creee depuis le tableau de bord s'appelle "maker".
#
# workers_dev est explicite: sans lui, un worker peut se deployer sans aucune
# route publique, et le tableau de bord affiche "No active routes" sans qu'on
# sache si le deploiement a echoue ou si l'URL est simplement desactivee.
#
# Le secret de la marketplace ne se met pas ici, un fichier versionne ne
# contient jamais de secret.
#
# Piege du tableau de bord: il existe deux encadres "Variables and secrets",
# celui du build et celui de l'execution. Une variable de build n'existe que
# pendant la construction, le worker qui tourne ne la voit jamais.
#
# Pour supprimer l'ambiguite, la commande de deploiement recopie la variable
# de build en secret d'execution a chaque fois:
#
#   echo "$RAPIDAPI_PROXY_SECRET" | npx wrangler secret put RAPIDAPI_PROXY_SECRET \
#     && npx wrangler deploy
#
# Verification: /health renvoie protected: true quand le secret est actif.

name = "maker"
main = "worker.mjs"
compatibility_date = "2026-09-01"
workers_dev = true

[observability]
enabled = true
